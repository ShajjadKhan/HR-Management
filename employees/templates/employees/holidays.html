{% extends 'employees/base.html' %}
{% block content %}
<h2>Public Holidays</h2>
<a href="{% url 'holiday_add' %}" class="btn btn-primary mb-3">+ Add Holiday</a>
<table class="table">
    <thead><tr><th>Date</th><th>Name</th><th>Action</th></tr></thead>
    <tbody>
    {% for h in holidays %}
        <tr>
            <td>{{ h.holiday_date }}</td>
            <td>{{ h.name }}</td>
            <td><a href="{% url 'holiday_delete' h.id %}" class="btn btn-sm btn-danger">Delete</a></td>
        </tr>
    {% empty %}
        <tr><td colspan="3">No holidays added.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
