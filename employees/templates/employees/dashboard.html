<!DOCTYPE html>
<html lang="en">
<head>
    <title>HR Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; direction: ltr; }
        .card { background: white; padding: 20px; margin: 10px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); display: inline-block; width: 30%; text-align: center; }
        .card h3 { color: #555; font-size: 16px; }
        .card h1 { color: #007bff; margin: 10px 0; }
        .search-box { margin: 20px 10px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        #results { margin-top: 10px; }
        .result-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; color: #333; }
        .result-item:hover { background: #e9ecef; }
    </style>
</head>
<body>
    <h2>HR Management Dashboard</h2>
    <div class="card">
        <h3>Total Employees</h3>
        <h1>{{ total_employees }}</h1>
    </div>
    <div class="card">
        <h3>Total Revenue (SAR)</h3>
        <h1>{{ total_revenue }}</h1>
    </div>
    <div class="card">
        <h3>Net Margin (SAR)</h3>
        <h1>{{ net_margin }}</h1>
    </div>
    
    <div class="search-box">
        <h3>Smart Employee Search</h3>
        <input type="text" id="searchInput" placeholder="Type at least 2 letters of Name or Iqama Number..." onkeyup="search()">
        <div id="results"></div>
    </div>

    <script>
        function search() {
            let query = document.getElementById('searchInput').value;
            let resultsDiv = document.getElementById('results');
            if (query.length < 2) { 
                resultsDiv.innerHTML = ''; 
                return; 
            }
            
            fetch(`/employees/search/?q=${query}`)
            .then(response => response.json())
            .then(data => {
                resultsDiv.innerHTML = '';
                data.forEach(emp => {
                    resultsDiv.innerHTML += `<div class='result-item'><strong>${emp.name}</strong> - Iqama: ${emp.iqama_number}</div>`;
                });
            });
        }
    </script>
</body>
</html>
