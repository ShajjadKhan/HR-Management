{% extends 'employees/base.html' %}
{% block content %}
<div class="card" style="max-width: 500px; margin: auto;">
    <h2 class="lang-text" data-en="Add Client Company" data-ar="إضافة شركة عميلة">Add Client Company</h2>
    <form method="POST">
        {% csrf_token %}
        <label class="lang-text" data-en="Company Name:" data-ar="اسم الشركة:">Company Name:</label>
        <input type="text" name="name" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid var(--border-color); border-radius: 5px;" required>
        <button type="submit" style="width: 100%; padding: 10px; background-color: var(--accent-blue); color: white; border: none; border-radius: 5px; font-weight: bold;">Save Company</button>
    </form>
</div>
{% endblock %}
