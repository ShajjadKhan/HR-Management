{% extends 'employees/base.html' %}
{% block content %}
<h2>{% if property %}Edit{% else %}Add{% endif %} Property</h2>
<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_property_name" class="form-label">Property Name</label>
        <input type="text" name="property_name" id="id_property_name" class="form-control" value="{{ form.property_name.value|default:'' }}" required>
    </div>
    <div class="mb-3">
        <label for="id_charge_amount" class="form-label">Charge Amount (SAR)</label>
        <input type="number" step="0.01" name="charge_amount" id="id_charge_amount" class="form-control" value="{{ form.charge_amount.value|default:'' }}" required>
        <small class="text-muted">Amount charged to the client.</small>
    </div>
    <button type="submit" class="btn btn-success">Save Property</button>
    <a href="{% url 'properties_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
